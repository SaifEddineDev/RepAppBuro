name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Build React app
        env:
          REACT_APP_API_URL: https://repappburo-api.onrender.com/api
          REACT_APP_DEMO_WEB_URL: https://saifeddinedev.github.io/RepAppBuro/demo
        run: npm run build --prefix frontend
      - name: Save production build
        run: mv frontend/build frontend/build-production
      - name: Build isolated demo app
        env:
          REACT_APP_API_URL: https://repappburo-demo-api.onrender.com/api
          REACT_APP_DEMO_MODE: 'true'
          PUBLIC_URL: /RepAppBuro/demo
        run: npm run build --prefix frontend
      - name: Assemble GitHub Pages site
        run: |
          mv frontend/build frontend/build-demo
          mkdir -p frontend/build-production/demo
          cp -R frontend/build-demo/. frontend/build-production/demo/
          rm -rf frontend/build-demo
          mv frontend/build-production frontend/build
          test -f frontend/build/index.html
          test -f frontend/build/demo/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
